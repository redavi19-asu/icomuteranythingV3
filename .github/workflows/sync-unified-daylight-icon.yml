name: Sync approved Unified daytime icon
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-unified-daylight-icon.yml"
      - "src/components/sections/SoftwareShowcase.jsx"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact approved icon from Unified source repository
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/redavi19-asu/ICA-unified-/main/Daylight%20Global%20News%20LMS%20AMS%20Icon.png" \
            -o public/images/ica-unified-icon.png
          file public/images/ica-unified-icon.png | grep -q 'PNG image data'
      - name: Commit exact icon image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/ica-unified-icon.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish approved daytime Unified icon on ICA V3"
          git pull --rebase origin main
          git push origin HEAD:main
