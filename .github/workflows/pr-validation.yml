name: Validate ICA Site PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test platform-worker/access-grants.test.js
      - run: node --test platform-worker/trading-assistant.test.js platform-worker/trading-router.test.js platform-worker/schwab-connection.test.js src/master/trading-paper-engine.test.js src/master/trading-approval-engine.test.js src/master/paper-session.test.js platform-worker/paper-runner.test.js platform-worker/trading-smart-money.test.js platform-worker/schwab-quote-freshness.test.js
      - run: npm run build
