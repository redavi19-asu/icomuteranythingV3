name: Apply Director Showcase Refresh

on:
  push:
    branches:
      - update/director-features

permissions:
  contents: write

jobs:
  patch-director-showcase:
    if: ${{ !contains(github.event.head_commit.message, '[director-showcase-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: update/director-features
          fetch-depth: 0

      - name: Update Urban Director Studio showcase
        run: node scripts/update-director-showcase.mjs

      - name: Remove one-time updater
        run: |
          rm -f scripts/update-director-showcase.mjs
          rm -f .github/workflows/apply-director-showcase.yml

      - name: Commit refreshed ICA Director section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/sections/SoftwareShowcase.jsx scripts/update-director-showcase.mjs .github/workflows/apply-director-showcase.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh ICA Director feature showcase [director-showcase-applied]"
          git push origin HEAD:update/director-features
