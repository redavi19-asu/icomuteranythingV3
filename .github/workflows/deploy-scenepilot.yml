name: Deploy ScenePilot via ICA Master
# Sync ScenePilot email opt-in and account changes
# Deploy protected Program editor policy
# Deploy director hamburger cleanup
# Restore Director selfie cam card
# Deploy raw ISO customer recording policy
# Deploy low-latency large watch player and TV controls

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-scenepilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-scenepilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ScenePilot
        uses: actions/checkout@v4
        with:
          repository: redavi19-asu/scenepilot
          ref: main
          path: scenepilot

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scenepilot/package-lock.json

      - name: Install dependencies
        working-directory: scenepilot
        run: npm ci

      - name: Validate ScenePilot
        working-directory: scenepilot
        run: |
          npm run lint
          npm run build


      - name: Deploy ScenePilot Worker and assets
        working-directory: scenepilot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment secrets are missing."
            exit 1
          fi
          npx wrangler deploy --config wrangler.jsonc
